<text x="306" y="420" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN',Meiryo,sans-serif" font-size="19" font-weight="700" fill="#172b4d">3.  パートナー連携の強化</text>
<text x="331" y="454" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN',Meiryo,sans-serif" font-size="17" font-weight="400" fill="#445672">・新規取引先との協議を継続する</text>
