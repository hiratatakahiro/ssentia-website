<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 580" width="380" height="580" role="img" aria-labelledby="ttl desc">
<title id="ttl">業務の棚卸し（業務フロー図）</title>
<desc id="desc">見積もり作成から契約書作成までの7ステップと、各ステップで使うツール・書式・連絡先へのリンクを示したサンプル図</desc>
<style>
.bg{fill:#ffffff;stroke:#e3e9f2;stroke-width:1}
.hd{font:700 16px "Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;fill:#1e4a8a}
.st{font:700 14px "Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;fill:#1b3a6b}
.lk{font:400 12px "Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;fill:#2f66c0;text-decoration:underline}
.nm{font:700 11px "Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;fill:#ffffff}
.nt{font:400 12px "Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;fill:#8a93a0}
.ax{stroke:#c9d6ea;stroke-width:1}
.dot{fill:#3d6cb5}
</style>
<rect class="bg" x="0.5" y="0.5" width="379" height="579" rx="12"/>
<text class="hd" x="20" y="36">① 業務の棚卸し（業務フロー図）</text>
<line class="ax" x1="36" y1="76" x2="36" y2="468"/>
<circle class="dot" cx="36" cy="76" r="11"/><text class="nm" x="36" y="80" text-anchor="middle">1</text>
<text class="st" x="62" y="81">見積もり作成</text>
<text class="lk" x="62" y="103">クラウド見積Pro（見積作成ソフト）</text>
<text class="lk" x="62" y="125">見積ソフト操作マニュアル.pdf</text>
<circle class="dot" cx="36" cy="156" r="11"/><text class="nm" x="36" y="160" text-anchor="middle">2</text>
<text class="st" x="62" y="161">上長承認</text>
<text class="lk" x="62" y="183">決裁権限表・承認基準（社内wiki）</text>
<circle class="dot" cx="36" cy="214" r="11"/><text class="nm" x="36" y="218" text-anchor="middle">3</text>
<text class="st" x="62" y="219">提出</text>
<text class="lk" x="62" y="241">送付状テンプレート.docx</text>
<circle class="dot" cx="36" cy="272" r="11"/><text class="nm" x="36" y="276" text-anchor="middle">4</text>
<text class="st" x="62" y="277">受注</text>
<text class="lk" x="62" y="299">受注管理シート（スプレッドシート）</text>
<circle class="dot" cx="36" cy="330" r="11"/><text class="nm" x="36" y="334" text-anchor="middle">5</text>
<text class="st" x="62" y="335">関係部署へ連絡</text>
<text class="lk" x="62" y="357">業務管理部　kanri@example.co.jp</text>
<text class="lk" x="62" y="379">製造部　seizo@example.co.jp</text>
<circle class="dot" cx="36" cy="410" r="11"/><text class="nm" x="36" y="414" text-anchor="middle">6</text>
<text class="st" x="62" y="415">先方と打ち合わせ</text>
<text class="lk" x="62" y="437">議事録テンプレート・過去議事録一覧</text>
<circle class="dot" cx="36" cy="468" r="11"/><text class="nm" x="36" y="472" text-anchor="middle">7</text>
<text class="st" x="62" y="473">契約書作成</text>
<text class="lk" x="62" y="495">契約書フォーマット格納先（共有ドライブ）</text>
<text class="nt" x="20" y="536">※ 各ステップから、使う道具・書式・連絡先に</text>
<text class="nt" x="20" y="554">直接たどり着けるようにしておくのが要点</text>
</svg>
